<!DOCTYPE html>
<html dir="ltr" lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>Breadcrumb</title>

  <script type="module" src="/build/alcance.esm.js"></script>
  <script nomodule src="/build/alcance.js"></script>
  <link rel="stylesheet" href="/build/alcance.css">
</head>

<body>
  <div class="container-fluid">
    <alc-theme></alc-theme>
    <hr class="mb-2">

    <alc-breadcrumb>
      <alc-breadcrumb-item label="Inicio" url="#"></alc-breadcrumb-item>
    </alc-breadcrumb>

    <alc-breadcrumb>
      <alc-breadcrumb-item><a href="#">Inicio</a></alc-breadcrumb-item>
      <alc-breadcrumb-item><a href="#">Nossos serviços</a></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Midia Digital" url="#"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Design Web" url="#"></alc-breadcrumb-item>
    </alc-breadcrumb>

    <alc-breadcrumb>
      <alc-breadcrumb-item label="Inicio" url="#" icon-name="house"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Nossos serviços" url="#"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Midia Digital" url="#"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Design Web" url="#"></alc-breadcrumb-item>
    </alc-breadcrumb>


    <alc-breadcrumb>
      <alc-breadcrumb-item label="Shop" url="#" icon-name="house"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Cart" url="#" icon-name="cart"></alc-breadcrumb-item>
      <alc-breadcrumb-item label="Delivery" url="#" icon-name="truck"></alc-breadcrumb-item>

    </alc-breadcrumb>
    

  </div>


</body>

</html>
