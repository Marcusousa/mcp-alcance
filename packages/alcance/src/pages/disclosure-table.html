  <!--
    #tkt-15511
    Criado de forma experimental.

    Seria preciso ter mais clareza sobre a estrutura dessa tabela.
    Por exemplo, "João Silva" é cabeçalho ou conteúdo?
    Com ficaria se houvesse outra pessoa?

    O avanço nessa implementação depende de mais definições sobre
    que solução adotaremos para tabelas responsivas.
  -->
  <div role="table" aria-label="estudantes" >
    <h2>Estudantes</h2>
    <div role="rowgroup">
      <div role="row" onclick="handletable(this)" id="tabela" aria-expanded="false" tabindex="0">
        <div role="rowheader">
          João Silva
          <alc-icon name="chevron-right" label=""></alc-icon>
        </div>
      </div>

      <div role="rowgroup" class="table-content" aria-hidden="true">
        <div role="row" >
          <span role="rowheader" tabindex="0">Idade</span>
          <span role="cell" tabindex="0">16</span>
        </div>
        <div role="row">
          <span role="rowheader" tabindex="0">Colégio</span>
          <span role="cell" tabindex="0">Visão</span>
        </div>
      </div>
    </div>

  </div>


  <script>
    function handletable(el) {
      const parentEl = el.parentElement.querySelector('.table-content');
      const icon = el.querySelector('alc-icon')

      if(!parentEl.style.display || parentEl.style.display == 'none') {
        parentEl.style.display = 'block';
        parentEl.open = true;
        icon.name = "chevron-down"
        el.ariaExpanded = 'true';
        parentEl.ariaHidden = 'false';
      } else {
        parentEl.style.display = 'none';
        parentEl.open = false;
        icon.name = "chevron-right"
        el.ariaExpanded = 'false';
        parentEl.ariaHidden = 'true';
      }
    }

    const tabela = document.getElementById('tabela');
    tabela.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') {
        handletable(tabela)
      }
    })

  </script>
