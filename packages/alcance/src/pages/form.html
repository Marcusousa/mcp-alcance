  <script type="module">

    const dataAutocompleteExamples = {
       "busca-comissoes": "https://dadosabertos.camara.leg.br/api/v2/orgaos?ordem=ASC&ordenarPor=id",
    }
    
    async function delay(time) {
       return new Promise(resolve => setTimeout(resolve, time));
    }

    async function fetchData(url, acElement) {

       acElement.loading = true;
       acElement.error = false;
       try {
          // Apenas para simulação de atraso do serviço
          console.log('antes do delay');
          await delay(500);
          console.log('depois do delay');

          // Obtenção dos dados
          const response = await fetch(url);
          const json = await response.json();
          // Transformação/tratamento dos dados.
          acElement.items = json.dados;
          if (json.dados.length === 0) {
             acElement.error = true;
             console.debug('error - length');
          }
       } catch (error) {
          // Tratamento de erros
          console.error('Erro ao buscar dados:', error);
          acElement.items = [];
          acElement.error = true;
          console.debug('error - catch');
       } finally {
          acElement.loading = false;
       }
    }


    // Setup da busca de dados.
    for (const id in dataAutocompleteExamples) {
       let autocomplete = document.getElementById(id);
       // BUSCAR DADOS NO MOMENTO EM QUE O ELEMENTO FOI FOCADO A PRIMEIRA VEZ
       autocomplete.addEventListener('focusin', async () => {
          const url = dataAutocompleteExamples[id];
          await fetchData(url, autocomplete);
       }, { once: true });
    }

 </script>
