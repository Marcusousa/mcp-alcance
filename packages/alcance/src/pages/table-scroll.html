    <style type="text/css">
      /*
        Solução de scroll horizontal com base em:
        https://adrianroselli.com/2020/11/under-engineered-responsive-tables.html
      */
      #table-wrapper__NAO-UTILIZADO {
        /* Necessário para ter o scroll */
        overflow: auto;

        /* Indicação de scroll */
        background:
          linear-gradient(to right, #fff 30%, rgba(255, 255, 255, 0)),
          linear-gradient(to right, rgba(255, 255, 255, 0), #fff 70%) 0 100%,
          radial-gradient(farthest-side at 0% 50%,
            rgba(0, 0, 0, 0.6),
            rgba(0, 0, 0, 0)),
          radial-gradient(farthest-side at 100% 50%,
            rgba(0, 0, 0, 0.6),
            rgba(0, 0, 0, 0)) 0 100%;
        background-repeat: no-repeat;
        background-color: #fff;
        background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
        background-position: 0 0, 100%, 0 0, 100%;
        background-attachment: local, local, scroll, scroll;
      }
    </style>

    <style type="text/css">
      /*
        Faz parte da solução de coluna fixa (junto com o JS correspondente)
        Inspirado em tabelas do Google Analytics
      */

      /*
        Classes envolvidas:
        1. is-fixed
        Deve ser aplicada às colunas fixas
        No momento, está preparado apenas para a primeira coluna poder ser fixa.

        2. has-fixed
        Deve ser aplicada a table-wrapper quando tiver colunas fixas

        3. has-scroll-start
        Deve ser aplicada a table-wrapper quando tiver espaço para rolar para o começo.
        Essa classe é controlada pelo JS já existente nessa página.

        4. has-scroll-end
        Deve ser aplicada a table-wrapper quando tiver espaço para rolar para o fim.
        Essa classe é controlada pelo JS já existente nessa página.

      */


      #table-wrapper {
        overflow: auto;
      }

      #table-wrapper table tr {
        border-bottom: 1px solid gray; /* Apenas para validar a existência das bordas */
      }

      #table-wrapper .is-fixed {
        position: sticky;
        left: 0;
        background-color: #fff;
      }

      #table-wrapper.has-scroll-start .is-fixed:after {
        -webkit-border-start: 1px solid #80868b;
        -moz-border-start: 1px solid #80868b;
        border-inline-start: 1px solid #80868b;
        box-shadow: inset 3px 0 3px -2px #80868b;
        content: "";
        height: 100%;
        position: absolute;
        right: -5px;
        top: 0;
        width: 5px;
      }

      #table-wrapper:not(.has-fixed) tr::before,
      #table-wrapper tr::after {
        content: '\a0';
      }

      #table-wrapper.has-scroll-start:not(.has-fixed) tr::before {
        -webkit-border-start: 1px solid #80868b;
        -moz-border-start: 1px solid #80868b;
        border-inline-start: 1px solid #80868b;
        box-shadow: inset 3px 0 3px -2px #80868b;
        position: sticky;
        left: -1px; /* O esperado seria 0... mas ficou meio estranho. Ficar atento a isso. */
        display: table-cell;
      }

      #table-wrapper.has-scroll-end tr::after {
        -webkit-border-end: 1px solid #80868b;
        -moz-border-end: 1px solid #80868b;
        border-inline-end: 1px solid #80868b;
        box-shadow: inset -3px 0 3px -2px #80868b;
        position: sticky;
        right: -1px; /* O esperado seria 0... mas ficou meio estranho. Ficar atento a isso. */
        display: table-cell;
      }

      th, td {
        padding: 0.5em;
      }

    </style>

  <script>
    // Faz parte da solução de coluna fixa (junto com o CSS correspondente)
    // Inspirado em tabelas do Google Analytics
    const w = document.querySelector('#table-wrapper');

    function handleScrollEnd () {
      // largura visível + pixel scrolled < largura total
      if (w.offsetWidth + w.scrollLeft < w.scrollWidth) {
        w.classList.add('has-scroll-end');
      }
      else {
        w.classList.remove('has-scroll-end');
      }
    }

    function handleScrollStart () {
      if (w.scrollLeft > 0) {
        w.classList.add('has-scroll-start');
      }
      else {
        w.classList.remove('has-scroll-start');
      }
    }

    // @TODO Pensar em uma solução de throttle ou debounce para esse evento.
    // Estudar o que seria melhor.
    // https://www.javascripttutorial.net/javascript-dom/javascript-scroll-events/
    // https://blog.rocketseat.com.br/debounce-vs-throttle-no-javascript/
    w.addEventListener('scroll', e => {
      console.log('scroll', e);
      handleScrollStart();
      handleScrollEnd();
    });

    handleScrollStart();
    handleScrollEnd();

  </script>
